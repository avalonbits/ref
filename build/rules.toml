[[page]]
file = "mos/Star-Commands.md"
heading_code = true
[[page.body]]
# "(Aliases include `Dir` and `.`)" -- not "(Alias for `Cat`)", which is the
# alias's own entry pointing the other way.
match = '\(Aliases? include ([^)]*)\)'


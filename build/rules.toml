# ref's rules for agon-docs: how the builder reads the wiki at the commit in
# SOURCE. Each rule says why it is there; when the wiki changes, the builder
# reports a rule that no longer applies.

# --- links the wiki gets wrong -------------------------------------------------
#
# A link the builder cannot resolve stops the build. When the fault is the
# wiki's, it is fixed here, never by skipping the link.

[[link_fix]]
page = "mos/API.md"
href = "#VDP-pflags-vdpflags"
to = "#vdp-pflags-vdpflags"
why = "the heading's anchor is lower case: the link is broken on the site too"

# --- normalising ---------------------------------------------------------------
#
# Applied to keys and to what the user types alike; ref.dat carries these so
# the viewer normalises exactly as the builder did. See refbuild/normalize.py.

[normalize]
# RST addresses are hex, written or not: `rst 10` is RST 10h.
hex_after = ["rst"]

[[skip]]
prefix = "VDU 23, 0, &A0"
units = [2]
why = "every buffered command names a 16-bit buffer ID before its command number"

[[skip]]
prefix = "VDU 23, 0, &85"
units = [1]
why = "every audio command names a channel before its command number"

